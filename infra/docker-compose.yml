services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: notebook
      POSTGRES_DB: notebook
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://notebook:notebook@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: everlast-notebook-demo-nextauth
      SALT: everlast-notebook-demo-salt
      TELEMETRY_ENABLED: "false"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://notebook:notebook@postgres:5432/notebook
      REDIS_URL: redis://redis:6379/0
      OLLAMA_API_BASE: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
      LANGFUSE_HOST: http://langfuse:3000
      FILE_STORE: /data/files
    ports:
      - "8000:8000"
    volumes:
      - file_store:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://notebook:notebook@postgres:5432/notebook
      REDIS_URL: redis://redis:6379/0
      OLLAMA_API_BASE: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
      LANGFUSE_HOST: http://langfuse:3000
      FILE_STORE: /data/files
    volumes:
      - file_store:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
  file_store:
