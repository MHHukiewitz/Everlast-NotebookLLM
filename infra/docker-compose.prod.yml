services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notebook
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    environment:
      ONNX_NUM_THREADS: "6"
      PYTORCH_NUM_THREADS: "6"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://notebook:${POSTGRES_PASSWORD}@postgres:5432/notebook
      OLLAMA_API_BASE: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
      TTS_LOCAL_BASE_URL: http://tts:8880
      TTS_PIPER_VOICE_DIR: /opt/tts-voices
      IMAGE_LOCAL_BASE_URL: http://127.0.0.1:8081
      FILE_STORE: /data/files
      SESSION_HTTPS: "true"
      LANGFUSE_HOST: ""
    volumes:
      - file_store:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
      tts:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  file_store:
  caddy_data:
  caddy_config:
